name: Generate File Hashes

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-hashes:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # .github/workflows/generate-hashes.yml — scoped to only what sw.js manages
    - name: Generate file hashes
      run: |
        # Pull the MANAGED_URLS array straight out of sw.js so this list
        # can never drift from what the service worker actually caches.
        node -e "
          const fs = require('fs');
          const sw = fs.readFileSync('sw.js', 'utf8');
          const match = sw.match(/MANAGED_URLS\s*=\s*\[([\s\S]*?)\]/);
          const urls = [...match[1].matchAll(/'([^']+)'/g)].map(m => m[1]);
          const files = urls
            .filter(u => u.startsWith('/'))
            .map(u => u === '/' ? 'index.html' : u.replace(/^\//, ''));
          fs.writeFileSync('.hash-manifest', files.join('\n'));
        "
        > hashes.txt
        while IFS= read -r file; do
          [ -f "$file" ] && sha256sum "$file" | sed "s|$file|  /$file|" >> hashes.txt
        done < .hash-manifest
        rm .hash-manifest
        sort -o hashes.txt hashes.txt

    - name: Commit and push hashes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add hashes.txt
        if git diff --staged --quiet; then
          echo "No changes to commit"
          exit 0
        fi
        git commit -m "Update hashes.txt [skip ci]"
        git push